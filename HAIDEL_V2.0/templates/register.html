<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S'inscrire — HAIDEL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#F0F2F5;min-height:100vh;display:flex;align-items:center;padding:40px 0}
:root{--brand:#8B4513}.form-control{border-radius:10px;padding:12px 16px;border:1.5px solid #DDD0C8}
.form-control:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(139,69,19,.12)}
.btn-brand{background:var(--brand);color:#fff;border:none;border-radius:22px;padding:12px;font-weight:700;width:100%}
.btn-brand:hover{background:#6B3410;color:#fff}.card{border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.1)}</style></head><body>
<div class="container" style="max-width:550px">
  <div class="text-center mb-4"><a href="{{ url_for('login') }}" style="font-size:1.5rem;font-weight:800;color:var(--brand);text-decoration:none">
    <span style="background:var(--brand);color:#fff;border-radius:8px;padding:2px 10px;margin-right:6px">H</span>HAIDEL
  </a></div>
  <div class="card p-4">
    <h5 class="fw-bold mb-1">Créer un compte</h5>
    <p class="text-secondary small mb-4">Rejoignez HAIDEL — ENCG Marrakech</p>
    {% if error %}<div class="alert alert-danger rounded-3 py-2 small">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="row g-2 mb-3"><div class="col"><input name="prenom" type="text" class="form-control" placeholder="Prénom *" required></div>
        <div class="col"><input name="nom" type="text" class="form-control" placeholder="Nom *" required></div></div>
      <div class="mb-3"><input name="email" type="email" class="form-control" placeholder="Email académique *" required></div>
      <div class="mb-3"><input name="password" type="password" class="form-control" placeholder="Mot de passe (min. 6 car.) *" required minlength="6"></div>
      <div class="mb-3"><label class="form-label small text-secondary fw-semibold">Année d'étude</label>
        <select name="annee" class="form-select" style="border-radius:10px;border:1.5px solid #DDD0C8">
          {% for a in ['1ère année','2ème année','3ème année','4ème année','5ème année'] %}<option>{{ a }}</option>{% endfor %}</select></div>
      <div class="mb-3"><label class="form-label small text-secondary fw-semibold">Club (optionnel)</label>
        <select name="club_id" class="form-select" style="border-radius:10px;border:1.5px solid #DDD0C8">
          <option value="">Aucun — Je suis étudiant</option>
          {% for c in clubs %}<option value="{{ c.id }}">{{ c.nom }}</option>{% endfor %}</select></div>
      <div class="mb-4 p-3 rounded-3" style="background:#F9F5F2">
        <div class="form-check"><input class="form-check-input" type="radio" name="statut" value="etudiant" id="s1" checked>
          <label class="form-check-label" for="s1">Étudiant</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="statut" value="membre" id="s2">
          <label class="form-check-label" for="s2">Membre d'un club</label></div>
      </div>
      <button type="submit" class="btn-brand mb-3">✅ Créer mon compte</button>
    </form>
    <div class="text-center"><a href="{{ url_for('login') }}" style="color:var(--brand);font-size:.88rem">← Retour à la connexion</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script></body></html>
